#
# RobotFrameworkAIO - pyproject.toml
#
# --------------------------------------------------------------------------------------------------------------

[build-system]
requires = ["setuptools==79.0.1", "wheel", "colorama==0.4.6", "pypandoc_binary==1.15", "PythonExtensionsCollection"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-documentation"
version = "0.37.0"
description = "Documentation for RobotFramework AIO"
authors = [
   {name = "Thomas Pollerspöck", email = "Thomas.Pollerspoeck@de.bosch.com"}
]
maintainers = [
   {name = "Thomas Pollerspöck", email = "Thomas.Pollerspoeck@de.bosch.com"}
]
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
   "pypandoc",
   "colorama",
   "GenPackageDoc",
   "PythonExtensionsCollection"
]

[project.urls]
Homepage = "https://github.com/test-fullautomation/robotframework-documentation"

[tool.setuptools]
packages = ["RobotFrameworkAIO"]

[tool.setuptools.package-data]
RobotFrameworkAIO = ["*.pdf", "*.rst"]
